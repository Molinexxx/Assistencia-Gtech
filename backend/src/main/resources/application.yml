spring:
  datasource:
    url: jdbc:mysql://localhost:3306/assistencia_gtech?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: assistencia_user
    password: Assistencia@123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo

server:
  servlet:
    context-path: /

app:
  security:
    aparelho-secret-key: ${APARELHO_SECRET_KEY:12345678901234567890123456789012}
    jwt-secret: ${JWT_SECRET:QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@gtech.local}
      nome: ${BOOTSTRAP_ADMIN_NOME:Administrador}

logging:
  level:
    org.hibernate.SQL: info
